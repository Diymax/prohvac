name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run verify:deployment-model
      # Сборка ДО тестов: часть набора обслуживает оболочку из dist/index.html
      # (uniform404, app.outage, spa). Без неё они получают 503 вместо 404,
      # и на чистом клоне набор не проходил никогда.
      - run: npm run build
      - run: npm test
      - run: npm run smoke:migrations
      - run: npm run smoke:production
      - run: npm run build:release
        env:
          SOURCE_DATE_EPOCH: 0
      - run: npm run verify:release
      - run: npm run smoke:release
      - run: npm run build:source-handoff
        env:
          SOURCE_DATE_EPOCH: 0
      - run: npm run verify:source-handoff
      - name: Generated tree must remain clean
        run: |
          git status --porcelain --untracked-files=all \
            | grep -Ev '^\?\? release/' \
            | (! grep .)
